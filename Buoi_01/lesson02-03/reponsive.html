<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>responsive</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      /* pc width >=1024 ->min-width
        tablet width>=740 vaf width <1024 -> minwoth 740 vaf maxwidth 1023
            mobile maxwith 739px
        */
      body {
        background-color: aquamarine;
        display: flex;
        height: 100vh;
        line-height: 100vh;
      }
      .mobile,
      .tablet,
      .pc {
        color: blueviolet;
        font-size: 100px;
        display: none;
        margin: 0 auto;
      }

      @media screen and (min-width: 1024px) {
        .pc {
          display: block;
        }
      }

      @media screen and (min-width: 740px) and (max-width: 1023px) {
        .tablet {
          display: block;
        }
      }

      @media screen and (max-width: 739px) {
        .mobile {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <h2 class="mobile">
      <i class="fa fa-mobile" aria-hidden="true"></i>
      Mobile
    </h2>
    <h2 class="tablet">tablet</h2>
    <h2 class="pc">pc</h2>
  </body>
</html>
