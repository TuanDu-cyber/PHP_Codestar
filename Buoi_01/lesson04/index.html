<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="password" id="mat-khau" value="nongsan2026" />
    <button type="button" id="btn-mat-khau">Hiện</button>

    <script>
      //logic show/hide pass
      const oMatkhau = document.querySelector("#mat-khau");
      const nut = document.querySelector("#btn-mat-khau");
      nut.addEventListener("click", () => {
        const dangAn = oMatkhau.type === "password";
        oMatkhau.type = dangAn ? "text" : "password";
        nut.textContent = dangAn ? "An" : "Hien";
      });
    </script>
  </body>
</html>
