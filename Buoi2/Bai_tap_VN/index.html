<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách đi chợ</title>
    <style>
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        line-height: 1.6;
      }
      .demo-box {
        border: 1px solid #ddd;
        padding: 12px;
      }
      .demo-box input {
        padding: 6px 8px;
        width: 200px;
        max-width: 100%;
      }
      #ds {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
      }
      #ds li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eee;
        padding: 8px 0;
        cursor: pointer;
      }

      .da-mua {
        text-decoration: line-through;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="demo-box">
      <form id="form">
        <label for="o-ten">Tên món:</label>
        <input type="text" id="o-ten" placeholder="VD: pizza" />
        <button type="submit">Thêm món</button>
      </form>
      <div id="thong-ke">Còn 0/0 món chưa mua</div>
      <ul id="ds"></ul>
    </div>

    <script>
      const form = document.querySelector("#form");
      const oTen = document.querySelector("#o-ten");
      const ds = document.querySelector("#ds");
      const thongKe = document.querySelector("#thong-ke");

      //Hàm để cập nhật số lượng món
      function capNhatThongKe() {
        const tongSoMon = ds.querySelectorAll("li").length;
        const soMonDaMua = ds.querySelectorAll("li.da-mua").length;
        const soMonChuaMua = tongSoMon - soMonDaMua;

        thongKe.textContent = `Còn ${soMonChuaMua}/${tongSoMon} món chưa mua`;
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const ten = oTen.value.trim();
        if (ten === "") return;

        //Tạo dòng món
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = ten;
        li.append(span);

        //Click 1 lần để gạch ngang or bỏ gạch ngang
        li.addEventListener("click", () => {
          li.classList.toggle("da-mua");
          capNhatThongKe();
        });

        //Nháy đúp để xóa món
        li.addEventListener("dblclick", () => {
          li.remove();
          capNhatThongKe();
        });

        //Ghép vào danh sách
        ds.append(li);

        //Clear input
        oTen.value = "";
        oTen.focus();

        //Cập nhật lại số lượng sau khi thêm món mới
        capNhatThongKe();
      });
    </script>
  </body>
</html>
